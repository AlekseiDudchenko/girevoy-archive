name: Finalize PFO 2023 correction branch

on:
  push:
    branches:
      - fix/pfo-2023-womens-snatch-weight
    paths:
      - .github/workflows/pfo-2023-errata-move.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update roadmap and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/roadmap.md')
          text = path.read_text(encoding='utf-8')
          old = (
              '- [ ] Подсвечивать известные ошибки и расхождения в публичных протоколах красным и\n'
              '  показывать комментарий при наведении. Источник замечаний — `ERRATA.md` и структурированные\n'
              '  данные об ошибках.\n'
          )
          new = (
              '- [ ] Пересмотреть структуру хранения информации об ошибках, расхождениях и\n'
              '  редакционных исправлениях: определить единый машиночитаемый формат в `data/*.json`,\n'
              '  отдельно хранить исходное значение, значение архива, факт применённого исправления,\n'
              '  публичность и статус подтверждения организатором.\n'
              '- [ ] Разработать механизм отображения ошибок и редакционных исправлений на сайте:\n'
              '  показывать предупреждение на странице соревнования и рядом с затронутыми результатами,\n'
              '  явно выводить исходное и исправленное значения и статус подтверждения организатором;\n'
              '  ошибки исходного протокола не смешивать с ошибками оцифровки.\n'
          )
          if old not in text:
              raise SystemExit('roadmap error-display task not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/pfo-2023-errata-move.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document error storage and display roadmap"
          git push origin HEAD:fix/pfo-2023-womens-snatch-weight
