name: Apply PFO 2023 editorial correction

on:
  push:
    branches:
      - fix/pfo-2023-womens-snatch-weight
    paths:
      - .github/workflows/pfo-2023-errata-move.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply correction and warning metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('data/chempionat-pfo-2023.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))

          targets = {'Р 63', 'Р 68', 'Р 68+'}
          found = set()
          for category in data['categories']:
              if category.get('discipline') == 'snatch' and category.get('sex') == 'f' and category.get('source_sheet') in targets:
                  found.add(category['source_sheet'])
                  if category.get('bell_kg') not in (24, 32):
                      raise SystemExit(f"unexpected bell_kg in {category['source_sheet']}: {category.get('bell_kg')}")
                  category['bell_kg'] = 24
          if found != targets:
              raise SystemExit(f'missing target sheets: {targets - found}')

          warning = {
              'id': 'pfo-2023-womens-snatch-bell-weight',
              'type': 'source_error_correction',
              'severity': 'warning',
              'public': True,
              'scope': {
                  'discipline': 'snatch',
                  'sex': 'f',
                  'weight_classes': ['63', '68', '68+'],
                  'source_sheets': ['Р 63', 'Р 68', 'Р 68+']
              },
              'field': 'bell_kg',
              'source_value': 32,
              'corrected_value': 24,
              'correction_applied': True,
              'organizer_confirmation': {
                  'status': 'unconfirmed',
                  'confirmed_by': None,
                  'confirmed_at': None,
                  'evidence': None
              },
              'message': 'В исходном протоколе для женского рывка в категориях 63, 68 и 68+ кг указан вес гири 32 кг. Архив исправляет это значение на 24 кг как очевидную ошибку протокола. Исправление пока не подтверждено организатором.'
          }
          warnings = [w for w in data.get('warnings', []) if w.get('id') != warning['id']]
          warnings.append(warning)
          data['warnings'] = warnings
          data_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          errata_path = Path('ERRATA.md')
          text = errata_path.read_text(encoding='utf-8')
          start = text.find('- **ПФО-2023, женский рывок, листы `Р 63`, `Р 68`, `Р 68+`:**')
          if start == -1:
              raise SystemExit('PFO-2023 errata block not found')
          end = text.find('\n\n', start)
          if end == -1:
              raise SystemExit('PFO-2023 errata block end not found')
          old_block = text[start:end+2]
          new_block = '''- **ПФО-2023, женский рывок, листы `Р 63`, `Р 68`, `Р 68+`:** в исходном\n  Excel-протоколе указан вес гири `32 кг`; на листе `Р 58` указан `24 кг`. Архив\n  принимает редакционное решение исправить значение для категорий 63, 68 и 68+ кг\n  на `24 кг` как очевидную ошибку протокола. Исправление затрагивает 12 результатов.\n  **Статус подтверждения организатором: не подтверждено.** На сайте должно быть явно\n  указано и исходное значение (`32 кг`), и применённое архивом исправление (`24 кг`).\n  Машиночитаемая запись хранится в `data/chempionat-pfo-2023.json`: `source_value = 32`,\n  `corrected_value = 24`, `correction_applied = true`,\n  `organizer_confirmation.status = "unconfirmed"`.\n\n'''
          text = text[:start] + new_block + text[end+2:]
          errata_path.write_text(text, encoding='utf-8')
          PY

          npm run build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chempionat-pfo-2023.json ERRATA.md
          git commit -m "Correct PFO 2023 women's snatch weight with warning metadata"
          git push origin HEAD:fix/pfo-2023-womens-snatch-weight
