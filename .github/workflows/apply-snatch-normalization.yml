name: Apply snatch normalization patch

on:
  push:
    branches:
      - fix/snatch-one-hand-label

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/snatch-one-hand-label
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/apply_snatch_patch.py
      - name: Build and test
        run: npm run build
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gen_seed.py src/queries.js src/render.js scripts/build-static.sh package.json seeds/0006_normalize_snatch.sql tests/snatch-normalization.test.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: normalize snatch as one-hand discipline"
          git push origin HEAD:fix/snatch-one-hand-label
