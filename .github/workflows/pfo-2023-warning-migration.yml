name: PFO 2023 warning migration

on:
  push:
    branches:
      - fix/pfo-2023-womens-snatch-weight
    paths:
      - .github/workflows/pfo-2023-warning-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Store source warning and remove correction patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('data/chempionat-pfo-2023.json')
          text = data_path.read_text(encoding='utf-8')
          data = json.loads(text)

          snatch = {
              c['source_sheet']: c
              for c in data['categories']
              if c.get('discipline') == 'snatch' and c.get('sex') == 'f'
          }
          expected_source_values = {'Р 58': 24, 'Р 63': 32, 'Р 68': 32, 'Р 68+': 32}
          actual = {sheet: snatch[sheet]['bell_kg'] for sheet in expected_source_values}
          if actual != expected_source_values:
              raise SystemExit(f'unexpected PFO-2023 source values: {actual}')

          warning = {
              'id': 'pfo-2023-womens-snatch-bell-weight',
              'type': 'source_error',
              'severity': 'warning',
              'public': True,
              'scope': {
                  'discipline': 'snatch',
                  'sex': 'f',
                  'weight_classes': ['63', '68', '68+'],
                  'source_sheets': ['Р 63', 'Р 68', 'Р 68+'],
              },
              'field': 'bell_kg',
              'source_value': 32,
              'expected_value': 24,
              'organizer_confirmation': {
                  'status': 'unconfirmed',
                  'confirmed_by': None,
                  'confirmed_at': None,
                  'evidence': None,
              },
              'message': 'В исходном протоколе для женского рывка в категориях 63, 68 и 68+ кг указан вес гири 32 кг. Это, вероятно, ошибка протокола; ожидаемый вес — 24 кг. Официального подтверждения организатора пока нет.',
          }

          if '"warnings":' in text:
              warnings = [w for w in data.get('warnings', []) if w.get('id') != warning['id']]
              warnings.append(warning)
              data['warnings'] = warnings
              text = json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n'
          else:
              marker = ',"columns":'
              if marker not in text:
                  raise SystemExit('columns marker not found')
              warning_json = json.dumps(warning, ensure_ascii=False, separators=(',', ':'))
              text = text.replace(marker, ',"warnings":[' + warning_json + ']' + marker, 1)
              if not text.endswith('\n'):
                  text += '\n'
              json.loads(text)
          data_path.write_text(text, encoding='utf-8')

          errata_path = Path('ERRATA.md')
          errata = errata_path.read_text(encoding='utf-8')
          old = '''- **ПФО-2023, женский рывок, листы `Р 63`, `Р 68`, `Р 68+`:** при импорте вес
            снаряда был ошибочно записан как `32 кг`; лист `Р 58` при этом уже был записан
            как `24 кг`. Ошибка затронула 12 результатов и создавала на сайте отдельную
            ложную серию «Рывок · 32 кг». Исправление переводит эти три категории на `24 кг`.
            **Публичное предупреждение обязательно:** на странице ПФО-2023 и у затронутых
            результатов нужно явно показать, что вес снаряда был исправлен при оцифровке,
            а не скрывать коррекцию только внутри данных.
          '''
          new = '''- **ПФО-2023, женский рывок, листы `Р 63`, `Р 68`, `Р 68+`:** в исходном
            Excel-протоколе указан вес гири `32 кг`; на листе `Р 58` указан `24 кг`.
            Значение `32 кг` затрагивает 12 результатов и сохраняется в архиве как напечатано
            в источнике. Это выглядит как ошибка самого протокола: для женского рывка
            ожидается `24 кг`. **На сайте требуется явное предупреждение** на странице
            ПФО-2023 и у затронутых результатов. Статус подтверждения организатором:
            **не подтверждено**. Машиночитаемая запись хранится в
            `data/chempionat-pfo-2023.json` (`organizer_confirmation.status = "unconfirmed"`).
          '''
          if old not in errata:
              raise SystemExit('expected ERRATA block not found')
          errata_path.write_text(errata.replace(old, new, 1), encoding='utf-8')
          PY

          git checkout origin/main -- scripts/build-static.sh
          rm -f seeds/0007_fix_pfo_2023_womens_snatch_weight.sql

          npm run build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chempionat-pfo-2023.json ERRATA.md scripts/build-static.sh seeds/0007_fix_pfo_2023_womens_snatch_weight.sql
          git commit -m "Model PFO 2023 source error warning"
          git push origin HEAD:fix/pfo-2023-womens-snatch-weight
