name: Temporary junior import validation

on:
  push:
    branches:
      - import/pervenstvo-yuniorov-2025

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-package-lock
      - name: Validate source and extracted rows
        run: |
          echo "5b31243f2148462faef795948bf1992d0ea0339c77171c7d8bb3e23f664d27fd  sources/2025/pr-yuniory-2025.pdf" | sha256sum -c -
          python3 - <<'PY'
          import json
          p="data/pervenstvo-rossii-yuniory-2025.json"
          d=json.load(open(p, encoding="utf-8"))
          cats=d["categories"]
          assert len(cats)==22, len(cats)
          assert sum(len(c["rows"]) for c in cats)==211
          assert {c["page"] for c in cats}==set(range(2,24))
          assert all(c.get("age_group")=="junior" for c in cats)
          assert all(c["time_limit_min"]==10 for c in cats)
          statuses=[]
          for c in cats:
              for r in c["rows"]:
                  if len(r)>17 and r[17]:
                      statuses.append((c["page"],r[1],r[17]))
                  if c["discipline"]=="biathlon":
                      assert abs(r[7] - (r[11] + r[12]/2)) < 1e-9, (c["page"],r)
          assert statuses==[(3,"Ярусов Константин","исключен, пункт правил 10.5")], statuses
          assert d["competition"]["competition_rank"]=="national_jr"
          assert d["competition"]["age_group"]=="junior"
          print("categories=22 rows=211 statuses=1 pages=2..23; biathlon arithmetic OK")
          PY
      - name: Build complete database
        run: python3 scripts/build_db.py --db /tmp/junior.db
      - name: Build baseline main database for delta
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          git worktree add /tmp/mainrepo origin/main
          (cd /tmp/mainrepo && python3 scripts/build_db.py --db /tmp/main.db)
      - name: Report entity delta
        run: |
          python3 - <<'PY'
          import sqlite3
          cur=sqlite3.connect("/tmp/junior.db")
          base=sqlite3.connect("/tmp/main.db")
          cur.execute("ATTACH DATABASE '/tmp/main.db' AS base")
          checks={
            "new athletes": """SELECT COUNT(*) FROM athletes a
              WHERE NOT EXISTS (SELECT 1 FROM base.athletes b
                WHERE b.full_name=a.full_name AND b.birth_year IS a.birth_year)""",
            "new people": """SELECT COUNT(*) FROM persons p
              WHERE NOT EXISTS (SELECT 1 FROM base.persons b WHERE b.slug=p.slug)""",
            "new coaches": """SELECT COUNT(DISTINCT p.slug)
              FROM persons p JOIN person_coach_athletes ca ON ca.person_id=p.id
              WHERE NOT EXISTS (
                SELECT 1 FROM base.persons bp
                JOIN base.person_coach_athletes bca ON bca.person_id=bp.id
                WHERE bp.slug=p.slug)""",
            "new regions": """SELECT COUNT(*) FROM regions r
              WHERE NOT EXISTS (SELECT 1 FROM base.regions b
                WHERE b.name=r.name AND b.country=r.country)""",
            "new clubs": """SELECT COUNT(*) FROM clubs c JOIN regions r ON r.id=c.region_id
              WHERE NOT EXISTS (
                SELECT 1 FROM base.clubs bc JOIN base.regions br ON br.id=bc.region_id
                WHERE bc.name=c.name AND br.name=r.name AND br.country=r.country)""",
          }
          for label,sql in checks.items():
              print(f"{label}: {cur.execute(sql).fetchone()[0]}")
          PY
      - name: Verify imported competition semantics
        run: |
          python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect("/tmp/junior.db")
          slug="pervenstvo-rossii-yuniory-2025"
          q=lambda sql,args=(): con.execute(sql,args).fetchone()[0]
          cid=q("select id from competitions where slug=?",(slug,))
          assert q("select count(*) from categories where competition_id=?",(cid,))==22
          assert q("select count(*) from results where competition_id=?",(cid,))==211
          assert q("select count(*) from results where competition_id=? and result_status is not null",(cid,))==1
          assert q("""select count(*) from categories c join age_groups a on a.id=c.age_group_id
                       where c.competition_id=? and a.code='junior'""",(cid,))==22
          assert q("""select count(*) from competitions c join competition_ranks r on r.id=c.competition_rank_id
                       where c.id=? and r.code='national_jr'""",(cid,))==1
          print("DB semantics OK: 22 junior categories, 211 results, 1 status")
          print("distinct athletes in competition:", q("select count(distinct athlete_id) from results where competition_id=?",(cid,)))
          print("distinct clubs in competition:", q("""select count(distinct a.club_id) from results r join athletes a on a.id=r.athlete_id where r.competition_id=? and a.club_id is not null""",(cid,)))
          print("distinct regions in competition:", q("""select count(distinct a.region_id) from results r join athletes a on a.id=r.athlete_id where r.competition_id=? and a.region_id is not null""",(cid,)))
          PY
      - name: People audit checks
        run: |
          python3 scripts/check_people_rules.py --report
          node --test tests/people.test.mjs
      - name: Build static site
        run: npm run build
