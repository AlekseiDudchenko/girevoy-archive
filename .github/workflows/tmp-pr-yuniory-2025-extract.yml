name: Temporary protocol extraction

on:
  push:
    branches:
      - import/pervenstvo-yuniorov-2025

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ocrmypdf tesseract-ocr-rus
      - name: Extract protocol
        run: |
          mkdir -p /tmp/protocol/pages
          pdfinfo sources/2025/pr-yuniory-2025.pdf > /tmp/protocol/pdfinfo.txt
          pdftoppm -jpeg -r 160 sources/2025/pr-yuniory-2025.pdf /tmp/protocol/pages/page
          ocrmypdf --language rus+eng --deskew --rotate-pages --optimize 0 --output-type pdf sources/2025/pr-yuniory-2025.pdf /tmp/protocol/ocr.pdf
          pdftotext -layout /tmp/protocol/ocr.pdf /tmp/protocol/ocr.txt
          wc -l /tmp/protocol/ocr.txt
          sed -n '1,160p' /tmp/protocol/ocr.txt
      - name: Upload extraction
        uses: actions/upload-artifact@v4
        with:
          name: pr-yuniory-2025-extraction
          path: /tmp/protocol
          retention-days: 1
