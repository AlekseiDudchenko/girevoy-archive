name: Temporary junior import generation

on:
  push:
    branches:
      - import/pervenstvo-yuniorov-2025

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate junior 2025 data
        run: |
          if [ -f data/pervenstvo-rossii-yuniory-2025.json ]; then
            echo "data file already exists; nothing to generate"
            exit 0
          fi
          python3 .github/tmp/generate_junior_2025.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pervenstvo-rossii-yuniory-2025.json
          git commit -m "data: import Russian junior championship 2025"
          git push origin HEAD:import/pervenstvo-yuniorov-2025
