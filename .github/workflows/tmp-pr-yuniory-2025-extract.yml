name: Temporary junior import checks

on:
  push:
    branches:
      - import/pervenstvo-yuniorov-2025

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect repository data ranges
        run: |
          python3 - <<'PY'
          import glob, json
          rows=[]
          for p in glob.glob("data/*.json"):
              try:
                  d=json.load(open(p, encoding="utf-8"))
              except Exception:
                  continue
              b=d.get("source",{}).get("id_base")
              if isinstance(b,int):
                  rows.append((b,p,d.get("competition",{}).get("slug")))
          for row in sorted(rows):
              print(*row, sep="\t")
          print("MAX_ID_BASE", max((r[0] for r in rows), default=0))
          PY
