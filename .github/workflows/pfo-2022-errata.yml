name: Add PFO 2022 errata

on:
  push:
    branches:
      - import/chempionat-pfo-2022
    paths:
      - '.github/workflows/pfo-2022-errata.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Add errata entry
        shell: python
        run: |
          from pathlib import Path

          path = Path('ERRATA.md')
          text = path.read_text(encoding='utf-8')
          marker = '\n## 2. Даты рождения расходятся между страницами\n'
          block = '''
**ПФО-2022 — ошибка источника, исправленная архивом.**

- **Женский рывок, категория 63+ кг, лист `Р 63 +`:** в исходном Excel-протоколе
  указан вес гири `32 кг`. Архив исправляет значение на `24 кг` как очевидную ошибку
  протокола; исправление затрагивает 5 результатов этой категории. **Статус
  подтверждения организатором: не подтверждено.** На сайте сохраняются исходное
  значение (`32 кг`) и применённое исправление (`24 кг`). Машиночитаемая запись —
  `data/chempionat-pfo-2022.json`, warning `pfo-2022-womens-snatch-63plus-bell-weight`.

'''
          if 'pfo-2022-womens-snatch-63plus-bell-weight' not in text:
              if marker not in text:
                  raise SystemExit('section 2 marker not found')
              text = text.replace(marker, '\n' + block + marker, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit errata and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pfo-2022-errata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ERRATA.md .github/workflows/pfo-2022-errata.yml
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Document PFO 2022 snatch source correction'
          git push origin "HEAD:${{ github.ref_name }}"
