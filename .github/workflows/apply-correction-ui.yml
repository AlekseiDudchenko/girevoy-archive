              "10. **Дисциплина = упражнение.** Число рук, регламент времени и зачёт по уровню\n    (любители / профессионалы / новички) — параметры категории, а не новые дисциплины.\n    Международные старты укладываются без расширения справочников.\n11. **Исправления архива видны читателю.** Если архив намеренно заменяет значение из\n    первоисточника, сохраняются исходное и исправленное значения. Исправление хранится\n    на сущности, где оно сделано, но публичный результат наследует влияющие на него\n    исправления категории, соревнования и спортсмена. Поэтому значок исправления не\n    теряется на странице соревнования, спортсмена или в «Все результаты».\n")
          replace('docs/decisions.md',
              "| FR-X9 | Правовая страница | Источник данных, порядок обращения и удаления по запросу субъекта, контакты | M | S |\n",
              "| FR-X9 | Правовая страница | Источник данных, порядок обращения и удаления по запросу субъекта, контакты | M | S |\n| FR-X10 | Публичные исправления | У каждого изменённого архивом значения сохранены исходное и исправленное значения; каждый затронутый результат помечен во всех публичных таблицах, включая наследуемые исправления категории | M | S |\n")
          replace('docs/schema.md',
              "**`edits` заводится сразу.** История правок в требованиях имеет приоритет C, но таблица\nдешёвая, а задним числом историю не восстановить.\n",
              "**`edits` заводится сразу.** История правок в требованиях имеет приоритет C, но таблица\nдешёвая, а задним числом историю не восстановить. Публичные редакционные исправления\nтакже материализуются сюда из `warnings[type=source_error_correction]` в `data/*.json`;\n`scripts/gen_corrections.py` помечает их `changed_by = source_correction:<id>`. Исходное\nзначение хранится в `old_value`, исправленное — в `new_value`. Категорийное исправление\nне дублируется по всем строкам: запросы добавляют его к `corrections` каждого результата\nкак наследуемое. То же правило поддерживается для исправлений соревнования и спортсмена.\nТак один источник истины даёт одинаковый индикатор на протоколе, карточке спортсмена и\nстранице «Все результаты».\n")
          PY

          cat > src/corrections.js <<'EOF'
          const PUBLIC_CORRECTION_PREFIX = 'source_correction:';

          const scopeName = (entity) => ({
            competitions: 'competition', categories: 'category',
            athletes: 'athlete', results: 'result',
          }[entity] || entity);

          const uniqueIds = (items, key) => [...new Set((items || []).map((item) => item?.[key])
            .filter((id) => id != null))];

          export async function attachEffectiveCorrections(db, rows = [], categories = []) {
            const ids = {
              results: uniqueIds(rows, 'id'),
              categories: [...new Set([...uniqueIds(rows, 'category_id'), ...uniqueIds(categories, 'id')])],
              athletes: uniqueIds(rows, 'athlete_id'),
              competitions: [...new Set([...uniqueIds(rows, 'competition_id'), ...uniqueIds(categories, 'competition_id')])],
            };
            const clauses = [];
            const args = [];
            for (const entity of ['results', 'categories', 'athletes', 'competitions']) {
              if (!ids[entity].length) continue;
              clauses.push(`(entity = ? AND entity_id IN (${ids[entity].map(() => '?').join(',')}))`);
              args.push(entity, ...ids[entity]);
            }
            if (!clauses.length) return rows;

            const edits = await db.all(`
              SELECT entity, entity_id, field, old_value, new_value, changed_by
              FROM edits
              WHERE changed_by LIKE 'source_correction:%'
                AND (${clauses.join(' OR ')})
              ORDER BY changed_at, id`, ...args);

            const maps = new Map();
            for (const entity of ['results', 'categories', 'athletes', 'competitions']) {
              maps.set(entity, new Map());
            }
            for (const edit of edits) {
              if (!maps.has(edit.entity)) continue;
              const map = maps.get(edit.entity);
              if (!map.has(edit.entity_id)) map.set(edit.entity_id, []);
              map.get(edit.entity_id).push({
                scope: scopeName(edit.entity),
                field: edit.field,
                source_value: edit.old_value,
                corrected_value: edit.new_value,
                correction_id: edit.changed_by.slice(PUBLIC_CORRECTION_PREFIX.length),
              });
            }

            for (const category of categories) {
              category.corrections = [
                ...(maps.get('competitions').get(category.competition_id) || []),
                ...(maps.get('categories').get(category.id) || []),
              ];
            }
            for (const row of rows) {
              row.corrections = [
                ...(maps.get('competitions').get(row.competition_id) || []),
                ...(maps.get('categories').get(row.category_id) || []),
                ...(maps.get('athletes').get(row.athlete_id) || []),
                ...(maps.get('results').get(row.id) || []),
              ];
            }
            return rows;
          }
          EOF

          cat > src/correction-ui.js <<'EOF'
          const FIELD_LABELS = {
            bell_kg: 'Вес гири', body_weight_kg: 'Собственный вес', birth_year: 'Год рождения',
            total_reps: 'Подъёмы', points: 'Результат', result_value: 'Результат', place: 'Место',
            time_limit_min: 'Регламент', hands: 'Руки', weight_class_raw: 'Весовая категория',
            discipline_id: 'Дисциплина', discipline: 'Дисциплина', event_date: 'Дата',
          };
          const UNITS = { bell_kg: ' кг', body_weight_kg: ' кг', time_limit_min: ' мин' };
          const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
          const valueText = (value) => value == null || value === '' ? '—' : String(value);

          export function correctionsForField(corrections, field) {
            return (corrections || []).filter((correction) => correction.field === field);
          }

          export function correctionTip(corrections) {
            const seen = new Set();
            const lines = ['Исправлено в архиве'];
            for (const correction of corrections || []) {
              const key = [correction.field, correction.source_value, correction.corrected_value].join('\u0000');
              if (seen.has(key)) continue;
              seen.add(key);
              const label = FIELD_LABELS[correction.field] || correction.field;
              const unit = UNITS[correction.field] || '';
              lines.push(`${label}: ${valueText(correction.source_value)}${unit} → ${valueText(correction.corrected_value)}${unit}`);
            }
            return lines.length > 1 ? lines.join('\n') : '';
          }

          export function correctionMarker(corrections, extraClass = '') {
            const tip = correctionTip(corrections);
            if (!tip) return '';
            const classes = ['correction-mark', extraClass].filter(Boolean).join(' ');
            const aria = tip.replace(/\n/g, '. ');
            return `<button type="button" class="${classes}" data-tip="${escapeHtml(tip)}" aria-label="${escapeHtml(aria)}"><span aria-hidden="true">✎</span></button>`;
          }
          EOF

          cat > scripts/gen_corrections.py <<'EOF'
          #!/usr/bin/env python3
          """Materialize public source corrections from data/*.json into the edits table."""
          import glob
          import json
          import sys

          CATEGORY_FIELDS = {
              "bell_kg", "hands", "time_limit_min", "weight_class_raw", "weight_class_kg",
              "weight_class_is_open", "sex", "age_group_id", "division_id", "discipline_id",
          }
          COMPETITION_FIELDS = {"name", "date_start", "date_end", "city", "country", "federation_id"}

          def esc(value):
              if value is None:
                  return "NULL"
              return "'" + str(value).replace("'", "''") + "'"

          def sql_list(values):
              return ", ".join(esc(value) for value in values)

          def inferred_entity(warning):
              explicit = warning.get("entity") or warning.get("scope", {}).get("entity")
              if explicit:
                  aliases = {"result": "results", "category": "categories", "athlete": "athletes", "competition": "competitions"}
                  return aliases.get(explicit, explicit)
              field = warning.get("field")
              if field in CATEGORY_FIELDS:
                  return "categories"
              if field in COMPETITION_FIELDS:
                  return "competitions"
              return "results"

          def category_filters(scope, alias="cat", discipline_alias="d"):
              where = []
              if scope.get("discipline"):
                  where.append(f"{discipline_alias}.code = {esc(scope['discipline'])}")
              if scope.get("sex"):
                  where.append(f"{alias}.sex = {esc(scope['sex'])}")
              if scope.get("weight_classes"):
                  where.append(f"{alias}.weight_class_raw IN ({sql_list(scope['weight_classes'])})")
              if scope.get("weight_class"):
                  where.append(f"{alias}.weight_class_raw = {esc(scope['weight_class'])}")
              if scope.get("hands"):
                  where.append(f"{alias}.hands = {esc(scope['hands'])}")
              if scope.get("time_limit_min") is not None:
                  where.append(f"{alias}.time_limit_min = {int(scope['time_limit_min'])}")
              if scope.get("bell_kg") is not None:
                  where.append(f"{alias}.bell_kg = {int(scope['bell_kg'])}")
              return where

          def result_filters(scope, result_alias="r"):
              where = []
              names = scope.get("athletes") or scope.get("athlete_names")
              if names:
                  where.append(f"{result_alias}.raw_name IN ({sql_list(names)})")
              if scope.get("athlete"):
                  where.append(f"{result_alias}.raw_name = {esc(scope['athlete'])}")
              if scope.get("places"):
                  where.append(f"{result_alias}.place IN ({', '.join(str(int(v)) for v in scope['places'])})")
              if scope.get("source_pages"):
                  where.append(f"{result_alias}.source_page IN ({', '.join(str(int(v)) for v in scope['source_pages'])})")
              if scope.get("result_ids"):
                  where.append(f"{result_alias}.id IN ({', '.join(str(int(v)) for v in scope['result_ids'])})")
              return where

          def warning_sql(comp_slug, warning):
              if warning.get("type") != "source_error_correction" or not warning.get("public") or not warning.get("correction_applied"):
                  return None
              field = warning.get("field")
              if not field or "id" not in warning:
                  return None
              entity = inferred_entity(warning)
              scope = warning.get("scope") or {}
              changed_by = f"source_correction:{warning['id']}"
              old_value = warning.get("source_value")
              new_value = warning.get("corrected_value")

              if entity == "competitions":
                  from_sql = "competitions c"
                  target = "c.id"
                  where = [f"c.slug = {esc(comp_slug)}"]
              elif entity == "categories":
                  from_sql = "categories cat JOIN competitions c ON c.id = cat.competition_id JOIN disciplines d ON d.id = cat.discipline_id"
                  target = "cat.id"
                  where = [f"c.slug = {esc(comp_slug)}", *category_filters(scope)]
              elif entity in {"results", "athletes"}:
                  from_sql = "results r JOIN categories cat ON cat.id = r.category_id JOIN competitions c ON c.id = r.competition_id JOIN disciplines d ON d.id = r.discipline_id"
                  target = "r.id" if entity == "results" else "r.athlete_id"
                  where = [f"c.slug = {esc(comp_slug)}", *category_filters(scope), *result_filters(scope)]
              else:
                  raise ValueError(f"Unsupported correction entity {entity!r} in {warning['id']}")

              where.append(
                  f"NOT EXISTS (SELECT 1 FROM edits existing WHERE existing.entity = {esc(entity)} "
                  f"AND existing.entity_id = {target} AND existing.field = {esc(field)} "
                  f"AND existing.changed_by = {esc(changed_by)})"
              )
              return (
                  "INSERT INTO edits (entity, entity_id, field, old_value, new_value, changed_by)\n"
                  f"SELECT DISTINCT {esc(entity)}, {target}, {esc(field)}, {esc(old_value)}, {esc(new_value)}, {esc(changed_by)}\n"
                  f"FROM {from_sql}\nWHERE " + "\n  AND ".join(where) + ";"
              )

          def main(paths):
              statements = ["-- Публичные исправления первоисточников. Сгенерировано scripts/gen_corrections.py."]
              for path in paths:
                  with open(path, encoding="utf-8") as handle:
                      data = json.load(handle)
                  competition = data.get("competition")
                  if not competition or not competition.get("slug"):
                      continue
                  for warning in data.get("warnings", []):
                      statement = warning_sql(competition["slug"], warning)
                      if statement:
                          statements.extend(["", f"-- {warning['id']}", statement])
              print("\n".join(statements))

          if __name__ == "__main__":
              main(sys.argv[1:] or sorted(glob.glob("data/*.json")))
          EOF
          chmod +x scripts/gen_corrections.py

          cat > tests/corrections.test.mjs <<'EOF'
          import { test } from 'node:test';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { listAllResults } from '../src/queries.js';
          import { renderCompetition, renderPerson, renderResults, links } from '../src/render.js';

          const correction = {
            scope: 'category', field: 'bell_kg', source_value: '32', corrected_value: '24', correction_id: 'test-bell',
          };

          const row = (overrides = {}) => ({
            id: 1, category_id: 2, athlete_id: 3, competition_id: 4,
            place: 1, last_name: 'Тестова', first_name: 'Анна', middle_name: '', slug: 'testova-anna-2000',
            birth_year: 2000, region: 'Регион', club: 'Клуб', body_weight_kg: 57.1,
            reps: [{ hand: 'both', reps: 50 }], result_value: 50,
            event_date: '2025-05-10', competition: 'Чемпионат', competition_slug: 'championship',
            discipline_name: 'Толчок', discipline_code: 'jerk', bell_kg: 24, hands: 'two', time_limit_min: 10,
            weight_class_raw: '58', sex: 'f', division: null, rank_achieved: null, rank_achieved_code: null,
            corrections: [correction], ...overrides,
          });

          test('correction generator materializes public source correction warnings', () => {
            const sql = execFileSync('python3', ['scripts/gen_corrections.py', 'data/chempionat-pfo-2023.json'], { encoding: 'utf8' });
            assert.match(sql, /source_correction:pfo-2023-womens-snatch-bell-weight/);
            assert.match(sql, /'bell_kg', '32', '24'/);
            assert.match(sql, /cat\.weight_class_raw IN \('63', '68', '68\+'\)/);
          });

          test('category correction is inherited by rows returned from all results', async () => {
            const db = {
              async all(sql) {
                if (sql.includes('FROM results r')) return [row({ corrections: undefined })];
                if (sql.includes('FROM edits')) return [{
                  entity: 'categories', entity_id: 2, field: 'bell_kg', old_value: '32', new_value: '24',
                  changed_by: 'source_correction:test-bell',
                }];
                throw new Error(`Unexpected query: ${sql}`);
              },
            };
            const rows = await listAllResults(db);
            assert.equal(rows[0].corrections.length, 1);
            assert.equal(rows[0].corrections[0].scope, 'category');
            assert.equal(rows[0].corrections[0].source_value, '32');
          });

          test('competition page marks category heading and every affected result row', () => {
            const r = row();
            const html = renderCompetition({
              comp: { name: 'Чемпионат', date_start: '2025-05-10', city: 'Город' },
              categories: [{
                id: 2, competition_id: 4, is_deferred: 0, discipline_name: 'Толчок', discipline_code: 'jerk',
                sex: 'f', age_group: 'Взрослые', division: null, bell_kg: 24, hands: 'two', time_limit_min: 10,
                weight_class_raw: '58', participants_declared: 1, corrections: [correction], rows: [r],
              }], L: links.worker,
            });
            assert.ok(html.includes('24 кг<button type="button" class="correction-mark correction-inline"'));
            assert.ok((html.match(/class="correction-mark/g) || []).length >= 2);
            assert.ok(html.includes('Вес гири: 32 кг → 24 кг'));
          });

          test('all results and athlete result tables keep the correction marker', () => {
            const r = row();
            const all = renderResults({ rows: [r], L: links.worker });
            assert.ok(all.includes('class="c correction-col"><button type="button" class="correction-mark"'));
            assert.ok(all.includes('Вес гири: 32 кг → 24 кг'));

            const person = renderPerson({
              person: { display_name: 'Тестова Анна', birth_year: 2000 }, activities: [], judgeRoles: [], coachedAthletes: [],
              athleteData: { athlete: {}, results: [r] }, L: links.worker,
            });
            assert.ok(person.includes('class="c correction-col"><button type="button" class="correction-mark"'));
            assert.ok(person.includes('Вес гири: 32 кг → 24 кг'));
          });
          EOF

