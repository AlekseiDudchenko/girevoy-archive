name: Снимок на GitHub Pages

# Собирает статический снимок сайта из сидов репозитория.
# Это витрина интерфейса, а не рабочий архив: боевой сайт живёт на Cloudflare,
# где страницы собираются из D1 (см. docs/roadmap.md).

on:
  push:
    # В репозитории пока нет main: ветка разработки и есть ветка по умолчанию.
    # Когда main появится, вторую строку можно убрать.
    branches:
      - main
      - claude/google-docs-link-review-uny4pe
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # снимок использует node:sqlite

      - name: Собрать базу со схемой, справочниками и данными протоколов
        run: |
          mkdir -p .local
          cat migrations/0001_init.sql seeds/0001_reference.sql \
            seeds/0003_chempionat-rossii-2026.sql | sqlite3 .local/girevoy.db
          echo "таблиц: $(sqlite3 .local/girevoy.db "SELECT COUNT(*) FROM sqlite_master WHERE type='table'")"
          echo "результатов: $(sqlite3 .local/girevoy.db 'SELECT COUNT(*) FROM results')"

      - name: Отрендерить страницы
        run: node scripts/snapshot.mjs .local/girevoy.db dist

      - name: Проверить, что страницы собрались
        run: |
          test -s dist/index.html
          test -s dist/results.html
          test -s dist/style.css
          test "$(ls dist/c-*.html | wc -l)" -ge 1
          test "$(ls dist/a-*.html | wc -l)" -ge 1
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
